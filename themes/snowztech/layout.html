<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{.Site.Meta.Title}}</title>
    <meta name="description" content="{{.Site.Meta.Description}}">
    <meta property="og:title" content="{{.Site.Meta.Title}}">
    <meta property="og:description" content="{{.Site.Meta.Description}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="snowztech">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/png" href="/assets/mark.png">
    <link rel="stylesheet" href="/assets/vendor/snowztech-ui/snowztech-ui.min.css">
    <link rel="stylesheet" href="/themes/snowztech/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="snowztech home">
          <img src="/assets/mark.png" alt="" width="42" height="42">
          <span class="sn-wordmark">snowztech</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="#projects">Projects</a>
          <a href="#about">About</a>
          <a href="https://github.com/snowztech">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </header>
      <main id="main">{{.Content}}</main>
      <footer class="site-footer">
        <span>© 2026 snowztech</span>
        <span>Built with <a href="https://github.com/snowztech/inkssg">Ink</a>.</span>
        <a href="https://github.com/snowztech">Find us on GitHub <span aria-hidden="true">↗</span></a>
      </footer>
    </div>
  </body>
</html>
