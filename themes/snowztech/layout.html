<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{.Site.Meta.Title}}</title>
    <meta name="description" content="{{.Site.Meta.Description}}">
    <meta property="og:title" content="{{.Site.Meta.Title}}">
    <meta property="og:description" content="{{.Site.Meta.Description}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="snowztech">
    <link rel="canonical" href="https://snowztech.com/">
    <meta property="og:url" content="https://snowztech.com/">
    <meta property="og:image" content="https://snowztech.com/assets/brand/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="snowztech — Software, built in the open.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.Site.Meta.Title}}">
    <meta name="twitter:description" content="{{.Site.Meta.Description}}">
    <meta name="twitter:image" content="https://snowztech.com/assets/brand/social-card.png">
    <meta name="twitter:image:alt" content="snowztech — Software, built in the open.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/vendor/snowztech-ui/snowztech-ui.min.css">
    <link rel="stylesheet" href="/themes/snowztech/styles.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "snowztech",
      "url": "https://snowztech.com/",
      "logo": "https://snowztech.com/assets/brand/apple-touch-icon.png",
      "description": "An independent software lab building open-source developer tools and native applications.",
      "founder": { "@type": "Person", "name": "Lucas Neves Pereira", "url": "https://lucasnp.dev/" },
      "sameAs": ["https://github.com/snowztech"]
    }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app">
      <header>
        <a class="brand" href="/" aria-label="snowztech home"><img src="/assets/brand/mark.svg" alt="" width="28" height="28">snowztech</a>
        <nav aria-label="Main navigation"><a href="https://github.com/snowztech">GitHub <span aria-hidden="true">↗</span></a></nav>
      </header>
      <main id="main">{{.Content}}</main>
      <footer>
        <span>© 2026 snowztech · Built with <a href="https://github.com/snowztech/inkssg">Ink</a></span>
        <a href="https://github.com/orgs/snowztech/repositories">All repositories <span aria-hidden="true">↗</span></a>
      </footer>
    </div>
    <script>
(async () => {
  const repos = { farol: "Farol", onecorp: "OneCorp", holt: "Holt", inkssg: "Ink", ui: "UI" };
  const box = document.querySelector(".latest");
  const key = "sz-latest";
  let items;
  try { items = JSON.parse(sessionStorage.getItem(key)); } catch {}
  if (!items) {
    const res = await Promise.allSettled(Object.keys(repos).map(async (r) => {
      const x = await fetch(`https://api.github.com/repos/snowztech/${r}/releases/latest`);
      if (!x.ok) throw 0;
      const j = await x.json();
      return { name: repos[r], ver: j.tag_name.split("@").pop().replace(/^v/, ""), at: j.published_at, url: j.html_url };
    }));
    items = res.filter((r) => r.status === "fulfilled").map((r) => r.value);
    if (!items.length) return;
    try { sessionStorage.setItem(key, JSON.stringify(items)); } catch {}
  }
  const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
  const ago = (d) => {
    const day = (t) => new Date(t).setHours(0, 0, 0, 0);
    const days = Math.round((day(d) - day(Date.now())) / 864e5);
    if (days > -7) return rtf.format(days, "day");
    if (days > -60) return rtf.format(Math.round(days / 7), "week");
    return rtf.format(Math.round(days / 30), "month");
  };
  items.sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 3).forEach((i) => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${i.url}"><span><span class="name"></span><span class="ver"></span></span><time datetime="${i.at}"></time></a>`;
    li.querySelector(".name").textContent = i.name;
    li.querySelector(".ver").textContent = i.ver;
    li.querySelector("time").textContent = ago(i.at);
    box.querySelector("ul").append(li);
  });
  box.hidden = false;
})();
    </script>
  </body>
</html>
